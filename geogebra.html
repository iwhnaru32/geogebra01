<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GeoGebra 枠外ツール付き</title>
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button.active {
      background-color: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    #snapshot-area {
      margin-top: 16px;
      border: 1px solid #ccc;
      padding: 10px;
      display: none;
      max-width: 820px;
    }
    #snapshot-img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- 枠外の操作ボタン群 -->
  <div class="toolbar">
    <button id="btn-pen" type="button">① ペン描画：OFF</button>
    <button id="btn-save" type="button">② 今の画面を保存</button>
    <button id="btn-show" type="button">③ 保存画面を表示</button>
    <button id="btn-prev" type="button">④ 前の画像</button>
    <button id="btn-next" type="button">④ 次の画像</button>
    <span id="snapshot-status">保存枚数: 0枚</span>
  </div>

  <!-- GeoGebra 描画枠 -->
  <div id="ggb-element"></div>

  <!-- 保存した画面の表示エリア -->
  <div id="snapshot-area">
    <div>
      <strong>保存画面プレビュー</strong>
      <span id="snapshot-index-label"></span>
      <button id="btn-hide" type="button" style="margin-left: 12px;">閉じる</button>
    </div>
    <img id="snapshot-img" alt="保存したGeoGebra画面">
  </div>

  <script>
    let ggbApi = null;
    let isPenMode = false;
    const savedSnapshots = [];
    let currentIndex = -1;

    const params = {
      "appName": "classic",
      "width": 800,
      "height": 500,
      // ★同じフォルダに置いた .ggb ファイル名を指定するだけ
      "filename": "graph.ggb",
      "showToolBar": false,
      "showAlgebraInput": false,
      "showMenuBar": false,
      "showResetIcon": false,
      "enableRightClick": false,
      "appletOnLoad": function(api) {
        ggbApi = api;
        ggbApi.setPerspective("G");
      }
    };

    window.addEventListener("load", function() {
      const applet = new GGBApplet(params, true);
      applet.inject("ggb-element");
    });

    const btnPen = document.getElementById("btn-pen");
    const btnSave = document.getElementById("btn-save");
    const btnShow = document.getElementById("btn-show");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnHide = document.getElementById("btn-hide");
    const snapshotArea = document.getElementById("snapshot-area");
    const snapshotImg = document.getElementById("snapshot-img");
    const snapshotStatus = document.getElementById("snapshot-status");
    const snapshotIndexLabel = document.getElementById("snapshot-index-label");

    function updateLabels() {
      snapshotStatus.textContent = `保存枚数: ${savedSnapshots.length}枚`;
      if (savedSnapshots.length > 0 && currentIndex >= 0) {
        snapshotIndexLabel.textContent = `（${currentIndex + 1} / ${savedSnapshots.length} 枚目）`;
      } else {
        snapshotIndexLabel.textContent = "";
      }
    }

    function renderSnapshot(index) {
      if (savedSnapshots.length === 0) {
        alert("まだ保存された画面がありません。");
        return;
      }
      currentIndex = (index + savedSnapshots.length) % savedSnapshots.length;
      snapshotImg.src = savedSnapshots[currentIndex];
      snapshotArea.style.display = "block";
      updateLabels();
    }

    btnPen.addEventListener("click", function() {
      if (!ggbApi) return;
      isPenMode = !isPenMode;
      if (isPenMode) {
        ggbApi.setMode(62);
        btnPen.textContent = "① ペン描画：ON（クリックで解除）";
        btnPen.classList.add("active");
      } else {
        ggbApi.setMode(0);
        btnPen.textContent = "① ペン描画：OFF";
        btnPen.classList.remove("active");
      }
    });

    btnSave.addEventListener("click", function() {
      if (!ggbApi) return;
      const pngBase64 = ggbApi.getPNGBase64(1, false, 96);
      if (!pngBase64) {
        alert("画面の取得に失敗しました。");
        return;
      }
      const dataUrl = "data:image/png;base64," + pngBase64;
      savedSnapshots.push(dataUrl);
      currentIndex = savedSnapshots.length - 1;
      updateLabels();
    });

    btnShow.addEventListener("click", function() {
      if (savedSnapshots.length === 0) {
        alert("まだ保存された画面がありません。");
        return;
      }
      if (currentIndex < 0) currentIndex = 0;
      renderSnapshot(currentIndex);
    });

    btnPrev.addEventListener("click", function() {
      renderSnapshot(currentIndex - 1);
    });

    btnNext.addEventListener("click", function() {
      renderSnapshot(currentIndex + 1);
    });

    btnHide.addEventListener("click", function() {
      snapshotArea.style.display = "none";
    });
  </script>
</body>
</html>
